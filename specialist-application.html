<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Анкета специалиста — Хорошее решение</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{color-scheme:dark;--accent:#ee7f2d;--muted:#aebbc7;--edge:#334252}
*{box-sizing:border-box}
body{margin:0;background:#0c1117;color:#f2f5f8;font:16px/1.5 Montserrat,system-ui,sans-serif}
main,header{max-width:1000px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--edge)}
header strong{letter-spacing:.1em;text-transform:uppercase}
a{color:#ffa766}
h1{font-size:clamp(30px,5vw,50px);line-height:1.1;margin:0 0 12px}
h2,h3,p{margin:0 0 12px}
.intro{color:var(--muted);max-width:65ch}
fieldset,.panel{min-width:0;margin:20px 0;padding:clamp(14px,3vw,28px);border:1px solid var(--edge);border-radius:16px;background:#121a24}
legend{font-weight:800;color:#ffa766;padding:0 8px}
.hero,.fields{display:grid;gap:16px}
.hero{grid-template-columns:minmax(145px,1fr) 2fr;margin-bottom:16px;align-items:start}
.fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.wide{grid-column:1/-1}
label{display:block;font-weight:650}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin:5px 0 0;font:inherit;background:#0c141d;color:inherit;border:1px solid var(--edge);border-radius:8px;padding:9px}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;vertical-align:middle;margin:0 6px 0 0}
textarea{resize:vertical}
.portrait{aspect-ratio:4/5;border:1px dashed var(--edge);border-radius:12px;background:#0c141d;display:grid;place-items:center;overflow:hidden;margin-bottom:8px;color:var(--muted)}
.portrait img{width:100%;height:100%;object-fit:cover;min-height:0}
.gallery{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.gallery div{position:relative}
.gallery img{width:90px;height:72px;object-fit:cover;border-radius:8px;display:block}
.gallery button{position:absolute;right:0;top:0;padding:2px 7px}
.hero-copy{padding-top:4px}
.hero-copy h3{overflow-wrap:anywhere;font-size:clamp(20px,3vw,32px);line-height:1.15}
.hero-copy p{color:var(--muted);overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
button,.button{cursor:pointer;border:1px solid var(--edge);border-radius:9px;background:#192533;color:inherit;padding:9px 14px;font:inherit;font-weight:750;text-decoration:none}
.primary{background:var(--accent);color:#10151b;border-color:var(--accent)}
button:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:2px solid #ffab72;outline-offset:3px}
small{display:block;color:var(--muted);margin:5px 0}
#message{min-height:1.5em;margin-top:14px;color:#ffa766}
[hidden]{display:none!important}
@media(max-width:580px){main,header{padding:16px}.hero,.fields{grid-template-columns:1fr}.portrait{max-width:200px}}
</style>
</head>
<body>
<header><strong>Хорошее решение</strong><a id="admin-back" href="/admin.html" hidden>В админку</a></header>
<main>
<h1 id="title">Анкета специалиста</h1>
<p class="intro" id="intro"></p>
<div id="content"></div>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script type="module" src="/specialist-application.js"></script>
</body>
</html>
